# Retro Launcher's tuned RetroArch settings (RetroArch runs hidden as the game engine).
# Pushed to /sdcard/RetroLauncher/retroarch.cfg; the launcher passes it with CONFIGFILE.
# Only the keys that matter are set; RetroArch fills in the rest.

# never write over this file
config_save_on_exit = "false"

# controllers: plug in and play
input_autodetect_enable = "true"
input_max_users = "4"
# Start + Select opens the in-game menu (save, load, reset, quit)
input_menu_toggle_gamepad_combo = "4"
# hold Start for 2 seconds also opens it (for pads without Select)
input_hold_start_to_menu = "true"
# Back on the remote opens the menu instead of quitting by accident
input_back_as_menu_toggle = "true"
input_quit_gamepad_combo = "0"
# a remote with arrows and OK can still play simple games
android_input_disconnect_workaround = "true"

# games pick up where you left off
savestate_auto_save = "true"
savestate_auto_load = "true"
savestate_auto_index = "false"
# in-game (battery) saves are written every 10 seconds, so nothing is lost if the engine is closed
autosave_interval = "10"
savefile_directory = "/storage/emulated/0/RetroLauncher/Saves"
savestate_directory = "/storage/emulated/0/RetroLauncher/Saves/states"
sort_savefiles_enable = "true"
sort_savestates_enable = "true"
system_directory = "/storage/emulated/0/RetroLauncher/BIOS"
screenshot_directory = "/storage/emulated/0/RetroLauncher/Screenshots"

# look: full screen, right shape, smooth, quiet
video_fullscreen = "true"
aspect_ratio_index = "22"
video_scale_integer = "false"
video_smooth = "true"
video_threaded = "true"
video_vsync = "true"
video_font_enable = "true"
menu_show_load_content_animation = "false"
notification_show_autoconfig = "false"
notification_show_remap_load = "false"
notification_show_config_override_load = "false"
notification_show_fast_forward = "false"
notification_show_patch_applied = "false"
notification_show_refresh_rate = "false"
notification_show_netplay_extra = "false"
menu_driver = "rgui"
rgui_show_start_screen = "false"

# sound: low latency without crackle on the S905W
audio_latency = "96"
audio_sync = "true"

# stay out of the way
pause_nonactive = "true"
quit_press_twice = "false"
check_firmware_before_loading = "false"
network_on_demand_thumbnails = "false"
menu_enable_widgets = "true"

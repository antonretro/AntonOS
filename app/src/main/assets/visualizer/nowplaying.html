<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RetroOS: Now Playing visualizer</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#vis{display:block;width:100%;height:100%;image-rendering:pixelated}
</style>
</head>
<body>
<canvas id="vis"></canvas>
<script>
// RetroOS's host page for Anthony's visualizer (visualizer.js is his engine, unchanged).
// The engine steps 30 times a second; presenting at 60 only repeats frames and doubles the GPU work on the
// Mali-450, which showed as small hitches. So screen updates are capped at a steady 30 a second here.
(function () {
  var raf = window.requestAnimationFrame.bind(window), last = 0, FRAME = 1000 / 30 - 2;
  window.requestAnimationFrame = function (cb) {
    return raf(function wait(t) { if (t - last < FRAME) return raf(wait); last = t; cb(t); });
  };
})();
</script>
<script src="visualizer.js"></script>
</body>
</html>
